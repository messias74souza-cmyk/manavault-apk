name: Build ManaVault Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configure pip constraints to prevent pip 26+ errors
        run: |
          echo "pip==24.3.1" > /tmp/pip_constraints.txt
          echo "PIP_CONSTRAINT=/tmp/pip_constraints.txt" >> $GITHUB_ENV

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf automake autopoint cmake gettext libtool \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtinfo5 zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.3.1" setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Pre-clone python-for-android and apply libthorvg patch
        run: |
          mkdir -p android_app/.buildozer/android/platform
          git clone -b develop --single-branch https://github.com/kivy/python-for-android.git android_app/.buildozer/android/platform/python-for-android
          sed -i 's|"lib/clang/\*/lib/linux"|"lib*/clang/\*/lib/linux"|g' android_app/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libthorvg/__init__.py

      - name: Setup persistent Android debug keystore
        run: |
          mkdir -p android_app/keystore
          mkdir -p ~/.android
          if [ -f android_app/keystore/debug.keystore ]; then
            echo "Using existing repository keystore"
            cp android_app/keystore/debug.keystore ~/.android/debug.keystore
          else
            echo "Generating fixed persistent keystore"
            keytool -genkey -v -keystore android_app/keystore/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ManaVault Debug,O=ManaVault,C=BR"
            cp android_app/keystore/debug.keystore ~/.android/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android_app/keystore/debug.keystore
            git commit -m "chore: save permanent debug keystore for seamless updates" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Build debug APK
        working-directory: android_app
        env:
          PIP_CONSTRAINT: /tmp/pip_constraints.txt
        run: yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManaVault-Android-debug
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: android_app/bin/*.apk
          tag_name: v1.13.0
          name: "ManaVault Android APK v1.13.0"
          body: "Arquivo APK do ManaVault com prioridade absoluta para a IA Visual Gemini na pesquisa por foto, otimização de compactação de imagem nativa e fallback para Scryfall apenas se o Gemini não encontrar."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
